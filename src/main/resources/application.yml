spring:
  application:
    name: fulltext-search-api

  datasource:
    url: jdbc:postgresql://localhost:5432/fulltext_search_db
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8089

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.rahul.fulltextsearch: INFO